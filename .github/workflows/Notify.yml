name: Notify Me
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  get_notifications:
    runs-on: ubuntu-latest
    outputs:
      message: ${{ steps.parse.outputs.message }}
      titles: ${{ steps.parse.outputs.titles }}
      count: ${{ steps.check.outputs.count }}
      status: ${{ steps.check.outputs.status }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check notifications
        id: check
        if: ${{ env.GH_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_AUTH_TOKEN }}
        run: |
          HTTP_CODE=$(curl -s -o notifications.json -w "%{http_code}" \
               -H "Authorization: token $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               -H "If-Modified-Since: $(cat last_modified.txt 2>/dev/null || echo '')" \
               -D headers.txt \
               "https://api.github.com/notifications")
          echo "status=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          if [ "$HTTP_CODE" = "200" ]; then
            COUNT=$(jq 'length' notifications.json)
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          fi
          echo "$HTTP_CODE"

      - name: Parse response
        id: parse
        if: steps.check.outputs.status == '200' && steps.check.outputs.count != '0'
        run: |
          TITLES=$(jq -r '.[] | "- " + .subject.title' notifications.json | head -10)
          MESSAGE="You have ${{ steps.check.outputs.count }} new notifications:
          $TITLES"

          titles_delim=$(openssl rand -hex 8)
          {
            echo "titles<<$titles_delim"
            echo "$TITLES"
            echo "$titles_delim"
          } >> "$GITHUB_OUTPUT"

          message_delim=$(openssl rand -hex 8)
          {
            echo "message<<$message_delim"
            echo "$MESSAGE"
            echo "$message_delim"
          } >> "$GITHUB_OUTPUT"

      - name: Update timestamp and commit
        if: steps.check.outputs.status == '200'
        run: |
          grep -i "last-modified" headers.txt | cut -d' ' -f2- | tr -d '\r' > last_modified.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_modified.txt
          git commit -m "Update last-modified timestamp" || echo "No changes"
          git push

  notify:
    runs-on: ubuntu-latest
    needs: get_notifications
    if: ${{ needs.get_notifications.outputs.status == '200' && needs.get_notifications.outputs.count != '0' }}
    steps:
      - name: Notify Slack
        if: ${{ (env.SLACK_BOT_TOKEN != '') && (env.SLACK_MEMBER_ID != '') }}
        uses: slackapi/slack-github-action@v2.1.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_MEMBER_ID: ${{ secrets.SLACK_MEMBER_ID }}
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": ${{ toJSON(secrets.SLACK_MEMBER_ID) }},
              "text": ${{ toJSON(needs.get_notifications.outputs.message) }}
            }

      - name: Notify Discord
        if: ${{ env.DISCORD_URL != '' }}
        env:
          DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MESSAGE: ${{ needs.get_notifications.outputs.message }}
        run: |
          curl -X POST "$DISCORD_URL" \
               -H "Content-Type: application/json" \
               -d "{\"content\": $(jq -Rn --arg m "$MESSAGE" '$m')}"
